test_metadata:
  type: config
  name: secrets
  description: set the description for your test

# Insert your tests here
task_definition:
  nginx:
    repo: nginx
    image: nginx
    secrets:
      API_KEY: /nginx/${EnvironmentName}/api/key
      API_SECRET: /nginx/${EnvironmentName}/api/secret
      ssm:
        APP_KEY: /nginx/${EnvironmentName}/app/key
        APP_SECRET: /nginx/${EnvironmentName}/app/secret
      secretsmanager:
        ACCESSKEY: /dont/use/accesskeys
        SECRETKEY:
          Ref: EnvironmentName
        MYSQL_PASSWORD:
          secret:
            Fn::ImportValue:
              Fn::Sub: ${EnvironmentName}-helpdb-Secret
          key: password
        MYSQL_ROOT_PASSWORD:
          secret:
            Fn::ImportValue:
              Fn::Sub: ${EnvironmentName}-helpdb-Secret
          key: password
        MYSQL_USER:
          secret:
            Fn::ImportValue:
              Fn::Sub: ${EnvironmentName}-helpdb-Secret
          key: username
        SUPER_USER:
          secret:
            Fn::ImportValue:
              Fn::Sub: ${EnvironmentName}-helpdb-Secret-Super
          key: username
        MYSQL_PASSWORD_PREVIOUS:
          secret:
            Fn::ImportValue:
              Fn::Sub: ${EnvironmentName}-helpdb-Secret
          key: password
          version_stage: AWSPREVIOUS
        MYSQL_USER_VERSIONED:
          secret:
            Fn::ImportValue:
              Fn::Sub: ${EnvironmentName}-helpdb-Secret
          key: username
          version_id: EXAMPLE1-90ab-cdef-fedc-ba987EXAMPLE

targetgroup:
  name: nginx
  container: nginx
  port: 80
  protocol: http
  listener: http
  healthcheck:
    path: /
    code: 200

iam_policies:
  s3:
    action:
      - s3:Get*
